name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions: {}

# The `analyze` job holds `security-events: write`, so its actions are pinned to
# commit SHAs rather than floating tags, on the same reasoning deploy.yml gives:
# a retagged upstream reaches a job that can write to this repo's security
# surface. `detect` is contents:read and could float, but pinning the whole file
# keeps the rule "any workflow with a write scope is pinned" checkable by eye.
# Dependabot updates SHA pins, so this costs nothing to maintain.
jobs:
  # CodeQL hard-errors with "could not process any code" when a language has no
  # source, and there is no JavaScript until Phase 6 adds static/js/. Detecting
  # it means the JS leg starts running by itself the moment that lands, instead
  # of sitting red until someone remembers to re-enable it.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: pick
        run: |
          langs='["python"]'
          if [ -n "$(git ls-files '*.js' '*.ts' '*.mjs' '*.cjs')" ]; then
            langs='["python","javascript-typescript"]'
          fi
          echo "languages=$langs" >> "$GITHUB_OUTPUT"
          echo "analysing: $langs"

  analyze:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: /language:${{ matrix.language }}
