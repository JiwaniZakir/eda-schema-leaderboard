name: ci

on:
  pull_request:
  push:
    branches: [main]

# Default to nothing. Each job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per guard, deliberately.
#
# These were originally sequential steps in a single job, which meant a lint error
# short-circuited everything after it: you fixed the lint, pushed, and only then
# discovered the test failure. It also made the Phase 0 negative test unprovable,
# since two guards can't be shown to fail independently when the first one exits
# before the second runs.
#
# Split, they run in parallel and a PR reports every problem at once.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run eda-validate

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Via make, not `uv run python build.py` directly. build.py is a Phase 3
      # deliverable, so the raw command makes this required check unsatisfiable
      # on the Phase 1 and Phase 2 PRs, and branch protection then blocks the
      # two phases everything else is built on. `make build` skips loudly until
      # build.py exists and runs it for real afterwards, which is also what
      # CLAUDE.md promises when it says CI enforces `make check`.
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore
