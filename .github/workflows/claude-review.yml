name: claude-review

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

# SECURITY NOTES
#
# This is the untrusted-input surface: once submissions open, most PRs arrive
# from forks carrying code we did not write.
#
# 1. The trigger is `pull_request`, NOT `pull_request_target`. On a fork PR that
#    means GITHUB_TOKEN is read-only and repository secrets are withheld. Switching
#    to pull_request_target would hand a fork's checkout write access and secrets,
#    which is the classic pwn-request. Do not change this trigger.
# 2. Permissions are per-job and minimal. Nothing here gets `contents: write`.
# 3. The full anthropics/claude-code-action@v1 is used rather than the base action
#    because it performs actor permission checks and handles fork contexts.
# 4. No PR-controlled text is interpolated into any run: step.
#
# AUTHENTICATION - workload identity federation, per PLAN.md Phase 0.
#
# There is no Anthropic credential in this repository's secrets, and there should
# never be one. The action exchanges the workflow's GitHub OIDC token for a
# short-lived Anthropic token, which is what `id-token: write` below is for.
# The three `vars.*` values are identifiers, not credentials - a rule ID, an org
# UUID and a service account ID - so they live in repository variables and are
# safe to read.
#
# This replaced an `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` setup
# where the secret was never set. The workflow resolved that in a `preflight` job
# that skipped the review when the key was absent, so `claude-review` reported
# SUCCESS on every pull request while never once invoking Claude. A workflow that
# is green because it did nothing is worse than one that is plainly red.
#
# The fix is structural, not a bigger warning. `secrets` is not available in a
# job-level `if:`, which is why the preflight job existed. `vars` IS available
# there, so the whole job now gates on configuration directly. When the
# identifiers are unset, zero jobs run and the workflow reports SKIPPED - a grey
# icon, not a green tick. When they are set and the federation exchange fails,
# the action step fails and takes the job with it. Neither state can be mistaken
# for a successful review.
#
# TO ENABLE: set these three repository variables (Settings > Secrets and
# variables > Actions > Variables), obtained from the Claude Console:
#   ANTHROPIC_FEDERATION_RULE_ID    fdrl_...
#   ANTHROPIC_ORGANIZATION_ID       a UUID
#   ANTHROPIC_SERVICE_ACCOUNT_ID    svac_...
#
# When creating the federation rule, constrain its subject. Anthropic's own
# guidance warns that an under-constrained `subject_prefix` also matches
# `pull_request` runs triggered from forks. For `pull_request` events the GitHub
# OIDC subject is `repo:OWNER/REPO:pull_request` with no ref component, so a ref
# constraint alone does not separate a fork PR from a same-repo one. Pin the
# prefix to this repository and add a `repository_owner` claim constraint. The
# same-repo `if:` gate below is defence in depth on top of that, not a substitute.

jobs:
  review:
    # Three independent conditions, all required:
    #   - the PR is from a branch in this repo, never a fork
    #   - federation is actually configured
    # A fork PR additionally gets `id-token` downgraded to read by GitHub, so the
    # OIDC fetch would fail even if this gate were removed. Three layers, because
    # the cost of the outer two is one expression each.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
      && vars.ANTHROPIC_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            Review this pull request against PLAN.md and docs/DATA_CONTRACT.md.

            Report only:
            - requirements in the plan that are not implemented
            - implemented behaviour that contradicts the plan or the data contract
            - correctness bugs: wrong logic, unhandled cases the plan names,
              silent failures
            - any new path that unpickles data or loads YAML with a tag-executing
              loader

            Do not report style preferences or speculative refactors.
            If the work is sound, say so plainly.

            Use `gh pr comment` for top-level feedback and
            mcp__github_inline_comment__create_inline_comment for specific lines.
            Post findings as GitHub comments; do not return them as chat text.

          # Tool restriction is what actually makes this review-only, because the
          # job's `permissions:` block does not constrain Claude: by default the
          # action does not use GITHUB_TOKEN at all. It mints a Claude GitHub App
          # installation token whose scope is set server-side and includes
          # contents:write. `contents: read` above does NOT stop Claude
          # committing.
          #
          # Both flags, not just the allowlist. --allowedTools only PRE-APPROVES;
          # tools left off it are still available and fall through to the
          # permission mode. In headless mode that fallthrough currently denies,
          # so an allowlist alone happens to work - but it is an implicit
          # behaviour of the runner, not a stated guarantee, and it is one
          # default change away from silently granting Edit and Write on a
          # workflow that reviews pull requests.
          #
          # --disallowedTools takes precedence and cannot be overridden by any
          # other permission rule, so the denial is explicit and order-independent.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --disallowedTools
            "Edit,Write,NotebookEdit,Bash(git:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(gh api:*)"
