name: deploy

on:
  push:
    branches: [main]
  # Fired by the experiments repo when new results land on its main.
  # SECURITY: client_payload is attacker-controllable by anyone who can trigger a
  # dispatch. It is deliberately never read here, not in run:, not in ref:, not
  # anywhere. This workflow always builds main and nothing else.
  repository_dispatch:
    types: [results-updated]
  workflow_dispatch:

permissions: {}

# Actions here are pinned to commit SHAs, not floating major tags, because this
# workflow holds `pages: write`. A retagged upstream would publish arbitrary
# content to the public leaderboard, which is exactly what the
# tj-actions/changed-files compromise did across thousands of repos in 2025.
# Dependabot updates SHA pins, so this costs nothing to maintain.
#
# The rule is "any workflow holding a write scope is pinned", and it applies to
# codeql.yml too, whose analyze job holds `security-events: write`. This comment
# previously claimed deploy.yml was the only such workflow, which was untrue and
# left codeql.yml floating. Workflows that are contents:read with no secrets
# (ci, size-guard, link-check, a11y) stay on tags deliberately.

# Never cancel a deploy midway; a half-published site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Build
        run: uv run python build.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
