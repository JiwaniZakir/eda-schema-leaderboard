name: deploy

on:
  push:
    branches: [main]
  # Fired by the experiments repo when new results land on its main.
  # SECURITY: client_payload is attacker-controllable by anyone who can trigger a
  # dispatch. It is deliberately never read here, not in run:, not in ref:, not
  # anywhere. This workflow always builds main and nothing else.
  repository_dispatch:
    types: [results-updated]
  workflow_dispatch:

permissions: {}

# Never cancel a deploy midway; a half-published site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Build
        run: uv run python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
