name: link-check

on:
  pull_request:
    paths:
      - "templates/**"
      - "docs/**"
      - "*.md"
      - "build.py"
  schedule:
    # Weekly. External links rot without anyone touching this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Build
        run: uv run python build.py

      - uses: lycheeverse/lychee-action@v2
        with:
          # Note: --exclude-mail was removed from lychee; mailto links are now
          # skipped by default and the opt-in is --include-mail. PLAN.md's Phase 7
          # gate still quotes the old flag.
          #
          # --root-dir is required from Phase 3 on. The page links its assets
          # root-relative (/static/css/base.css), because the deploy serves the
          # site under SITE_BASE, and lychee refuses to resolve a root-relative
          # link in a local file unless it is told what the root is: "Cannot
          # resolve root-relative link ... provide a root dir". It must point at
          # dist and not at the workspace, because static/css/theme.css exists
          # only in the built site; resolving against the repo would report a
          # false failure for it and a false pass for base.css. Verified with
          # lychee 0.24.2 that docs/ and ./*.md carry no root-relative link, so
          # one root serves all three inputs.
          args: >-
            --no-progress
            --accept 200,206,429
            --root-dir ${{ github.workspace }}/dist
            dist/ docs/ ./*.md
          fail: true
