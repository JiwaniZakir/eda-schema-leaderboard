[project]
name = "eda-schema-leaderboard"
version = "0.1.0"
description = "Static benchmark leaderboard for the EDA-Schema-V2 dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# torch is needed only to read checkpoint tensor shapes during ingest.
# The site build does not import it.
ingest = ["torch>=2.6"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12",
]

# `eda-validate` must stay a real entry point, never `python -m tools.validate`.
# Running the module as __main__ creates a second copy of it, so checks
# registering into the CHECKS dict land in a different dict than the one main()
# reads, and validation silently passes having done nothing. That bug shipped
# once already.
[project.scripts]
eda-validate = "tools.validate:main"
eda-baseline = "tools.baseline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Markdown is prose, not source. Ruff formats Python code blocks found inside
# `.md` files, which puts every document under docs/plans/ on the critical path
# of `make check` and of the CI lint job. Those documents are specifications:
# their snippets are deliberately partial, they are edited constantly, and a
# half-written example in a plan must never be able to fail the code gate. Ruff
# itself calls Markdown formatting experimental. Excluded here rather than in
# the Makefile so `make check`, CI and an editor integration all agree; CI runs
# `ruff check .` and `ruff format --check .` directly and reads this file too.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Grows as the phases land: tools/ and tests/ in Phase 1, build.py in Phase 3.
files = ["tools", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
