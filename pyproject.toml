[project]
name = "eda-schema-leaderboard"
version = "0.1.0"
description = "Static benchmark leaderboard for the EDA-Schema-V2 dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# torch is needed only to read checkpoint tensor shapes during ingest.
# The site build does not import it.
ingest = ["torch>=2.6"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12",
]

# Post-reset there is no Python in the repo, so there is nothing to build into a
# wheel. Phase 1 restores `tools/` and this flips back to a packaged project.
[tool.uv]
package = false

# RESTORE IN PHASE 1, together with the [build-system] and hatch wheel config:
#
#   [project.scripts]
#   eda-validate = "tools.validate:main"
#
# It must be a real entry point, not `python -m tools.validate`. Running the
# module as __main__ creates a second copy of it, so checks registering into
# tools.validate.CHECKS land in a different dict than the one main() reads, and
# validation silently passes having done nothing. That bug shipped once already.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Grows as the phases land: tools/ and tests/ in Phase 1, build.py in Phase 3.
files = []

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
