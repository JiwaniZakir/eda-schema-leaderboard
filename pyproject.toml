[project]
name = "eda-schema-leaderboard"
version = "0.1.0"
description = "Static benchmark leaderboard for the EDA-Schema-V2 dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# torch is needed only to read checkpoint tensor shapes during ingest.
# The site build does not import it.
ingest = ["torch>=2.6"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["tools", "tests", "build.py"]

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
